name: Asan Build & Test With Different Simd Option

on:
  push:
    paths:
      - 'src/simd/**'
    branches: [ "main", "0.*" ]
  workflow_dispatch:

jobs:
  build_asan_simd:
    permissions:
      contents: read
      id-token: write
    name: Asan Build Simd
    runs-on: ubuntu-22.04
    container:
      image: vsaglib/vsag:ci-x86-mkl
      volumes:
        - /opt:/useless
    strategy:
      matrix:
        simd_option: [
#          "avx2;-DDISABLE_AVX512_FORCE=1",
          "avx;-DDISABLE_AVX2_FORCE=1",
          "sse;-DDISABLE_AVX_FORCE=1",
          "generic;-DDISABLE_SSE_FORCE=1",
        ]
    concurrency:
      group: build-${{ matrix.simd_option }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/*
      - uses: actions/checkout@v4
      - name: Install ccache tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.9
          cache: false
      - name: Compiler cache
        uses: boringcache/one@e4ead12dabc993eba201c402a82e396166dade03 # v1.20.4
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/boringcache-tools
        with:
          mode: ccache
          trust-policy: auto
          fail-on-cache-error: true
      - name: Make Asan
        run: |
          export EXTRA_DEFINED=`echo "${{ matrix.simd_option }}" | awk -F';' '{print $2}'`
          export EXTRA_KEY=`echo "${{ matrix.simd_option }}" | awk -F';' '{print $1}'`
          echo ${EXTRA_DEFINED}
          echo ${EXTRA_KEY}
          echo "SIMD_KEY=${EXTRA_KEY}" >> $GITHUB_ENV
          export VSAG_ENABLE_INTEL_MKL=ON CMAKE_GENERATOR="Ninja"; make asan COMPILE_JOBS=4
      - name: Clean
        run: find ./build -type f -name "*.o" -exec rm -f {} +
      - name: Save Test
        uses: actions/upload-artifact@v5
        with:
          path: ./build
          name: test-x86-${{ env.SIMD_KEY }}-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

  test_asan_simd:
    name: Unit Test Simd
    needs: build_asan_simd
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        test_type: [ unittests, functests ]
        simd_key: [
#          avx2,
          avx,
          sse,
          generic
        ]
    concurrency:
      group: test-${{ matrix.simd_key }}-${{ matrix.test_type }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    container:
      image: vsaglib/vsag:ci-x86-mkl
      volumes:
        - /opt:/useless
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/*
      - uses: actions/checkout@v4
      - name: Clean Env
        run: rm -rf ./build
      - name: Download Test
        uses: actions/download-artifact@v5
        with:
          name: test-x86-${{ matrix.simd_key }}-${{ github.run_id }}
          path: ./build/
      - name: Do Asan Test In ${{ matrix.test_type }}
        run: |
          echo leak:libomp.so > omp.supp
          export LSAN_OPTIONS=suppressions=omp.supp
          chmod +x ./build/tests/${{ matrix.test_type }}
          ./scripts/testing/test_parallel_by_name.sh ${{ matrix.test_type }}

  clean_up:
    name: Clean Up
    needs: test_asan_simd
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        simd_key: [
#          avx2,
          avx,
          sse,
          generic
        ]
    steps:
      - name: Create Empty File
        run: touch /tmp/clean_up
      - name: Overwrite Test Artifact
        uses: actions/upload-artifact@v5
        with:
          path: /tmp/clean_up
          name: test-x86-${{ matrix.simd_key }}-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'
