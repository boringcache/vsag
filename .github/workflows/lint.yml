name: Lint

on:
  push:
    branches: [ "main", "0.*", "boringcache-validation" ]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  clang-tidy-check:
    permissions:
      contents: read
      id-token: write
    name: Lint
    runs-on: ubuntu-latest
    # runs-on: self-hosted
    container:
      image: vsaglib/vsag:ci-x86-openblas
    env:
      VSAG_ENABLE_CCACHE: "ON"
      VSAG_FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.ci-fetchcontent
      VSAG_THIRDPARTY_DOWNLOAD_DIR: ${{ github.workspace }}/.ci-downloads
    concurrency:
      group: lint-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust exact workspace for Git tooling
        run: ./scripts/ci/configure-git-safe-directory.sh
      - name: Prepare FetchContent Sources
        uses: ./.github/actions/prepare-fetchcontent
      - name: Cache ExternalProject Archives
        uses: boringcache/one@e4ead12dabc993eba201c402a82e396166dade03 # v1.20.4
        with:
          mode: archive
          cache-profiles: dependencies
          trust-policy: auto
          fail-on-cache-error: true
      - name: Install clang-tidy 15
        run: sudo apt install clang-tidy-15 -y
      - name: Install ccache tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.9
          cache: false
      - name: Compiler cache
        uses: boringcache/one@e4ead12dabc993eba201c402a82e396166dade03 # v1.20.4
        with:
          mode: ccache
          trust-policy: auto
          fail-on-cache-error: true
      - name: Run lint
        # `make release` defaults to the OpenBLAS backend. Reuse the system
        # OpenBLAS shipped in the ci-x86-openblas image so lint doesn't have
        # to rebuild OpenBLAS from source on every run.
        run: |
          export CMAKE_GENERATOR="Ninja"
          export EXTRA_DEFINED="-DVSAG_USE_SYSTEM_OPENBLAS=ON"
          make release
          make lint
