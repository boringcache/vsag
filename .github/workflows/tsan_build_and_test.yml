name: Tsan Build & Test Parallel

on:
  push:
    branches: [ "main", "0.*", "boringcache-validation" ]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [ "main", "0.*" ]
  workflow_dispatch:

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      non_markdown: ${{ steps.changes.outputs.non_markdown }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          # 'every' is REQUIRED here: with the default 'some' quantifier, the broad '**'
          # pattern would always match and the negation patterns ('!docs/**', '!**/*.md')
          # would have no effect, causing docs-only PRs to incorrectly trigger TSan.
          predicate-quantifier: 'every'
          filters: |
            non_markdown:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  build_tsan:
    permissions:
      contents: read
      id-token: write
    name: Build with TSAN
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.non_markdown == 'true'
    runs-on: ubuntu-22.04
    env:
      # TSan instruments VSAG, not third-party dependencies. The daily x86 ASan job
      # remains the dedicated guard for building bundled OpenBLAS from source.
      EXTRA_DEFINED: -DVSAG_USE_SYSTEM_OPENBLAS=ON
    concurrency:
      group: test_tsan_x86-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    container:
      image: vsaglib/vsag:ci-x86-openblas
      volumes:
        - /opt:/useless
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/*
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Install ccache tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.9
          cache: false
      - name: Compiler cache
        uses: boringcache/one@e4ead12dabc993eba201c402a82e396166dade03 # v1.20.4
        with:
          mode: ccache
          trust-policy: auto
          fail-on-cache-error: true
      - name: Make Tsan
        run: export CMAKE_GENERATOR="Ninja"; make tsan COMPILE_JOBS=3
      - name: Clean
        run: find ./build -type f -name "*.o" -exec rm -f {} +
      - name: Save Test
        uses: actions/upload-artifact@v5
        with:
          path: ./build
          name: test_x86-${{ github.run_id }}-tsan
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

  test_tsan:
    name: Run TSAN Tests
    needs: [changes, build_tsan]
    if: github.event_name != 'pull_request' || needs.changes.outputs.non_markdown == 'true'
    runs-on: ubuntu-22.04
    concurrency:
      group: test_tsan_x86-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    container:
      image: vsaglib/vsag:ci-x86-openblas
    steps:
      - uses: actions/checkout@v4
      - name: Clean Env
        run: rm -rf ./build
      - name: Download Test
        uses: actions/download-artifact@v5
        with:
          name: test_x86-${{ github.run_id }}-tsan
          path: ./build/
      - name: Run TSAN tests
        run: |
          echo race:libomp.so > omp.supp
          echo race:libomp.so.5 >> omp.supp
          echo race:fmt::v10::detail::format_decimal >> omp.supp
          echo "race:libmkl_intel_thread.so.2" >> omp.supp
          export TSAN_OPTIONS=suppressions=omp.supp
          chmod +x ./build/tests/functests
          ./build/tests/functests "[concurrent]~[daily]"
