name: Prepare dependency installations
description: Restore and validate exact ANTLR4 and HDF5 installations, or build them from source.

inputs:
  phase:
    description: Use auto normally, cold to seed from source, or warm to require a read-only restore.
    default: auto

runs:
  using: composite
  steps:
    - name: Cache ExternalProject archives
      uses: boringcache/one@e4ead12dabc993eba201c402a82e396166dade03 # v1.20.4
      with:
        setup: none
        mode: archive
        cache-profiles: dependencies
        trust-policy: ${{ inputs.phase == 'warm' && 'restore' || 'auto' }}
        fail-on-cache-error: true
    - name: Configure dependency identities
      shell: bash
      run: make configure-asan COMPILE_JOBS=3
    - name: Prepare exact dependency installations
      shell: bash
      env:
        CACHE_PHASE: ${{ inputs.phase }}
      run: |
        # BEGIN dependency write policy
        policy=(--read-only)
        case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
          push:refs/heads/main|schedule:refs/heads/main) policy=(--write) ;;
          workflow_dispatch:refs/heads/boringcache-validation)
            if [[ "$GITHUB_REPOSITORY" == "boringcache/vsag" ]]; then policy=(--write); fi ;;
        esac
        case "$CACHE_PHASE" in
          auto) ;;
          cold)
            [[ "${policy[0]}" == --write ]] || { echo "Cold seeding requires a trusted writer." >&2; exit 1; }
            policy+=(--skip-restore) ;;
          warm) policy=(--read-only --fail-on-cache-miss) ;;
          *) echo "Unknown dependency cache phase: $CACHE_PHASE" >&2; exit 1 ;;
        esac
        # END dependency write policy
        mkdir -p build-metrics/dependencies
        for dependency in antlr4 hdf5; do
          key=$(cat "build/.vsag-dependency-cache/$dependency.key")
          boringcache run --manual-entry "vsag-install-$dependency-$key:.ci-dependencies/$dependency" \
            --no-git --no-platform --fail-on-cache-error "${policy[@]}" -- \
            python3 -m scripts.ci.dependency_cache prepare \
              --spec "build/.vsag-dependency-cache/$dependency.json" \
              --prefix ".ci-dependencies/$dependency" \
              --report "build-metrics/dependencies/$dependency.json" --jobs 3
        done
    - name: Select validated installations
      shell: bash
      run: make configure-asan COMPILE_JOBS=3
